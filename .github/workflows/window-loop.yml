name: window-loop (throwaway)

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: owner/repo the window clones, works in and pushes to
        required: true
      slot:
        description: window slot and paired daemon identity
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

concurrency:
  group: paseo-window-${{ inputs.slot }}
  cancel-in-progress: false

run-name: window-${{ inputs.slot }} ${{ inputs.target_repo }}

jobs:
  window:
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
      options: --user root
    timeout-minutes: 150
    steps:
      - name: Install paseo and pi
        run: |
          set -euo pipefail
          npm i -g --ignore-scripts @getpaseo/cli@0.12.0 @earendil-works/pi-coding-agent@1.4.0
          pi install npm:opencode-zen-oauth@1.2.11
          pi --version
          paseo --version

      - name: Fetch the harness
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.pi/agent"
          curl -fsSL https://raw.githubusercontent.com/ilteoood/harness/main/AGENTS.md \
            -o "$HOME/.pi/agent/AGENTS.md"
          curl -fsSL https://raw.githubusercontent.com/ilteoood/harness/main/pi-agent.sh \
            -o "$RUNNER_TEMP/pi-agent.sh"
          if ! grep -qE 'paseo daemon([[:space:]]|$)' "$RUNNER_TEMP/pi-agent.sh"; then
            echo "::error::the harness script no longer boots the daemon"
            exit 1
          fi

      - name: Restore the daemon identity
        env:
          SERVER_ID_B64: ${{ secrets[format('PASEO_SERVER_ID_B64_{0}', inputs.slot)] }}
          KEYPAIR_B64: ${{ secrets[format('PASEO_DAEMON_KEYPAIR_B64_{0}', inputs.slot)] }}
        run: |
          set -euo pipefail
          if [ -z "$SERVER_ID_B64" ] || [ -z "$KEYPAIR_B64" ]; then
            echo "::error::window slot ${{ inputs.slot }} has no stored daemon identity"
            exit 1
          fi
          mkdir -p "$HOME/.paseo" && chmod 700 "$HOME/.paseo"
          printf '%s' "$SERVER_ID_B64" | base64 -d > "$HOME/.paseo/server-id"
          printf '%s' "$KEYPAIR_B64" | base64 -d > "$HOME/.paseo/daemon-keypair.json"
          chmod 600 "$HOME/.paseo/server-id" "$HOME/.paseo/daemon-keypair.json"
          node -e '
            const payload = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf-8"));
            if (payload.v !== 2 || !payload.publicKeyB64 || !payload.secretKeyB64) {
              console.error("the restored daemon keypair does not match the daemon keypair schema");
              process.exit(1);
            }
          ' "$HOME/.paseo/daemon-keypair.json"

      - name: Run the harness
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PASEO_PASSWORD: ${{ secrets.PASEO_PASSWORD }}
          PASEO_RELAY_ENABLED: "true"
        run: |
          set -euo pipefail
          date +%s%3N > "$RUNNER_TEMP/started-at"
          setsid nohup bash -c 'echo $$ > "$1"; exec bash "$2"' _ \
            "$RUNNER_TEMP/harness.pid" "$RUNNER_TEMP/pi-agent.sh" \
            > "$HOME/harness.log" 2>&1 < /dev/null &
          echo "the harness installs its toolchain and boots paseo when it is done"

      - name: Wait for the daemon
        run: |
          set -euo pipefail
          log="$HOME/.paseo/daemon.log"
          for _ in $(seq 1 2700); do
            grep -q "Server listening" "$log" 2> /dev/null && break
            pid=$(cat "$RUNNER_TEMP/harness.pid" 2> /dev/null || true)
            if [ -n "$pid" ] && ! kill -0 "$pid" 2> /dev/null; then
              echo "::error::the harness exited before booting paseo"
              tail -n 60 "$HOME/harness.log" || true
              exit 1
            fi
            sleep 1
          done
          grep -m1 "Server listening" "$log" || { echo "::error::the daemon never started"; tail -n 60 "$HOME/harness.log" || true; exit 1; }
          listening=$(date +%s%3N)
          if grep -q "Failed to load daemon keypair, regenerating" "$log"; then
            echo "::error::slot ${{ inputs.slot }} booted on a fresh keypair; its paired offer no longer matches"
            exit 1
          fi
          for _ in $(seq 1 120); do
            grep -q "relay_control_connected" "$log" 2> /dev/null && break
            sleep 1
          done
          grep -q "relay_control_connected" "$log" || { echo "::error::relay never connected"; exit 1; }
          relayed=$(date +%s%3N)
          for tool in gh pi pnpm; do
            if ! command -v "$tool" > /dev/null; then
              echo "::error::$tool is missing after the harness setup"
              exit 1
            fi
          done
          echo "listen latency: $((listening - $(cat "$RUNNER_TEMP/started-at"))) ms"
          echo "relay latency:  $((relayed - listening)) ms"

      - name: Generate the pi config
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.path.expanduser("~/.pi/agent/settings.json"))
          settings = json.loads(path.read_text())
          settings["defaultProjectTrust"] = "always"
          path.write_text(json.dumps(settings, indent=2) + "\n")
          PY
          cat "$HOME/.pi/agent/settings.json"

      - name: Prepare the target repo
        env:
          TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repo }}
          WINDOW_BRANCH: feature/window-${{ inputs.slot }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/target/$TARGET_REPO"
          mkdir -p "$(dirname "$target")"
          git clone --quiet "https://x-access-token:${TARGET_REPO_TOKEN}@github.com/${TARGET_REPO}.git" "$target"
          git -C "$target" config user.name "Matteo Pietro Dazzi"
          git -C "$target" config user.email "matteopietro.dazzi@gmail.com"

          probe_started=$(python3 -c 'import time;print(int(time.time()*1000))')
          git -C "$target" push --dry-run origin "HEAD:refs/heads/paseo-probe"
          probe_finished=$(python3 -c 'import time;print(int(time.time()*1000))')
          echo "write probe: $((probe_finished - probe_started)) ms"

          if git -C "$target" ls-remote --exit-code --heads origin "$WINDOW_BRANCH" > /dev/null; then
            git -C "$target" checkout --quiet "$WINDOW_BRANCH"
          else
            git -C "$target" checkout --quiet -b "$WINDOW_BRANCH"
          fi

          cat > "$target/.git/hooks/post-commit" <<'HOOK'
          #!/bin/bash
          set -euo pipefail
          branch=$(git symbolic-ref --short HEAD)
          default_branch=$(git rev-parse --abbrev-ref origin/HEAD | sed 's@^origin/@@')
          if [ "$branch" = "$default_branch" ]; then
            echo "post-commit: refusing to push $branch"
            exit 0
          fi
          if git push --quiet origin "HEAD:refs/heads/$branch"; then
            echo "post-commit: pushed $branch"
          else
            echo "post-commit: push of $branch failed"
          fi
          HOOK
          chmod +x "$target/.git/hooks/post-commit"

          git -C "$target" branch --show-current
          git -C "$target" log --oneline -1
          echo "TARGET_PATH=$target" >> "$GITHUB_ENV"

      - name: Register the project
        run: |
          set -euo pipefail
          paseo project create "$TARGET_PATH"
          paseo project ls

      - name: Steering window
        run: |
          echo "the window is open; steer from the app"
          echo "target: ${{ inputs.target_repo }}"
          echo "branch: feature/window-${{ inputs.slot }}"
          echo "host: Window-${{ inputs.slot }}"
          sleep 5400

      - name: Daemon log tail
        if: always()
        run: tail -n 400 "$HOME/.paseo/daemon.log" "$HOME/harness.log" || true
