name: plugin

on:
  push:
    paths:
      - "plugin/**"
      - ".github/workflows/plugin.yml"
  pull_request:
    paths:
      - "plugin/**"
      - ".github/workflows/plugin.yml"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
