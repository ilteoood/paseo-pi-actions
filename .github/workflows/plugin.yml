name: plugin

on:
  push:
    paths:
      - "client/**"
      - "server/**"
      - "shared/**"
      - "test/**"
      - "scripts/**"
      - "index.client.tsx"
      - "index.server.ts"
      - "package.json"
      - "package-lock.json"
      - "paseo-plugin.json"
      - "tsconfig.json"
      - "tsconfig.server.json"
      - ".github/workflows/plugin.yml"
  pull_request:
    paths:
      - "client/**"
      - "server/**"
      - "shared/**"
      - "test/**"
      - "scripts/**"
      - "index.client.tsx"
      - "index.server.ts"
      - "package.json"
      - "package-lock.json"
      - "paseo-plugin.json"
      - "tsconfig.json"
      - "tsconfig.server.json"
      - ".github/workflows/plugin.yml"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: bash -n scripts/window-identities.sh
