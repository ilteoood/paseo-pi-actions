name: plugin

on:
  push:
    paths:
      - "plugin/**"
      - ".github/workflows/plugin.yml"
  pull_request:
    paths:
      - "plugin/**"
      - ".github/workflows/plugin.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
