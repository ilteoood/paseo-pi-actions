name: window identity pool (throwaway)

on:
  workflow_dispatch:

jobs:
  pool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Paseo CLI
        run: npm i -g @getpaseo/cli@0.12.0

      - name: Restore and boot every slot identity
        env:
          SID_1: ${{ secrets.PASEO_SERVER_ID_B64_1 }}
          KEY_1: ${{ secrets.PASEO_DAEMON_KEYPAIR_B64_1 }}
          SID_2: ${{ secrets.PASEO_SERVER_ID_B64_2 }}
          KEY_2: ${{ secrets.PASEO_DAEMON_KEYPAIR_B64_2 }}
          SID_3: ${{ secrets.PASEO_SERVER_ID_B64_3 }}
          KEY_3: ${{ secrets.PASEO_DAEMON_KEYPAIR_B64_3 }}
          SID_4: ${{ secrets.PASEO_SERVER_ID_B64_4 }}
          KEY_4: ${{ secrets.PASEO_DAEMON_KEYPAIR_B64_4 }}
          SID_5: ${{ secrets.PASEO_SERVER_ID_B64_5 }}
          KEY_5: ${{ secrets.PASEO_DAEMON_KEYPAIR_B64_5 }}
        run: |
          set -euo pipefail
          for slot in 1 2 3 4 5; do
            home="$RUNNER_TEMP/slot-$slot"
            sid_var="SID_$slot"
            key_var="KEY_$slot"
            server_id_b64="${!sid_var}"
            keypair_b64="${!key_var}"
            test -n "$server_id_b64"
            test -n "$keypair_b64"

            mkdir -p "$home" && chmod 700 "$home"
            printf '%s' "$server_id_b64" | base64 -d > "$home/server-id"
            printf '%s' "$keypair_b64" | base64 -d > "$home/daemon-keypair.json"
            chmod 600 "$home/server-id" "$home/daemon-keypair.json"

            cat > "$home/config.json" <<JSON
          {"version":1,"daemon":{"listen":"127.0.0.1:$((6790 + slot))","relay":{"enabled":true},"cors":{"allowedOrigins":["https://app.paseo.sh"]}},"app":{"baseUrl":"https://app.paseo.sh"}}
          JSON

            setsid nohup paseo daemon run --home "$home" > "$home/daemon.log" 2>&1 < /dev/null &
            for _ in $(seq 1 90); do grep -q "Server listening" "$home/daemon.log" && break; sleep 1; done
            grep -m1 "Server listening" "$home/daemon.log"
            for _ in $(seq 1 120); do grep -q "relay_control_connected" "$home/daemon.log" && break; sleep 1; done
            grep -q "relay_control_connected" "$home/daemon.log"
            grep -q "Loaded daemon keypair" "$home/daemon.log"
            ! grep -q "regenerating" "$home/daemon.log"

            paseo daemon pair --home "$home" --json > "$home/pair.json"
            python3 - "$slot" "$home" <<'PY'
          import base64, hashlib, json, os, sys
          slot, home = sys.argv[1], sys.argv[2]
          offer = json.load(open(os.path.join(home, "pair.json")))["url"]
          encoded = offer.split("#offer=", 1)[1]
          payload = json.loads(base64.urlsafe_b64decode(encoded + "=" * (-len(encoded) % 4)))
          canonical = json.dumps(payload, sort_keys=True, separators=(",", ":"))
          keypair = open(os.path.join(home, "daemon-keypair.json"), "rb").read()
          print(f"slot {slot}: server-id={open(os.path.join(home, 'server-id')).read().strip()}")
          print(f"slot {slot}: keypair_sha256={hashlib.sha256(keypair).hexdigest()}")
          print(f"slot {slot}: offer_sha256={hashlib.sha256(canonical.encode()).hexdigest()}")
          PY

            kill "$(pgrep -f "paseo daemon run --home $home")" || true
            sleep 2
          done
