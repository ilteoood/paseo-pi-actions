version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/plugin"
    schedule:
      interval: "daily"
      time: "06:00"
    open-pull-requests-limit: 10
    versioning-strategy: "increase-if-necessary"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      paseo-sdk:
        patterns:
          - "@getpaseo/plugin"
          - "react"
          - "react-native"
          - "zod"
        update-types:
          - "minor"
          - "patch"
      tooling:
        patterns:
          - "typescript"
          - "@types/node"
          - "@types/react"
          - "@tanstack/react-query"
        update-types:
          - "minor"
          - "patch"
      security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns:
          - "*"
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
